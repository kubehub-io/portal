name: Build and publish Docker image (web)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image publication mode
        id: publish-mode
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "public_to=RemotePush" >> "$GITHUB_OUTPUT"
            echo "inspect_local=false" >> "$GITHUB_OUTPUT"
          else
            echo "public_to=OCIArchive:/tmp/portal-noarch.tar" >> "$GITHUB_OUTPUT"
            echo "inspect_local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove os/arch from image
        uses: kubehub-io/image-volume@v0.3.1
        with:
          imageTag: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          outputImageTag: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-noarch
          publicTo: ${{ steps.publish-mode.outputs.public_to }}

      - name: Inspect the converted image
        if: ${{ steps.publish-mode.outputs.inspect_local == 'true' }}
        run: |
          skopeo inspect "oci-archive:/tmp/portal-noarch.tar" \
            --format 'architecture={{.Architecture}} os={{.Os}}'