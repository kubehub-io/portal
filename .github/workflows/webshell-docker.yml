name: Build and publish Docker image (webshell)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile.webshell'
      - '.github/workflows/webshell-docker.yml'
  pull_request:
    paths:
      - 'Dockerfile.webshell'
      - '.github/workflows/webshell-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-webshell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up QEMU (for cross-platform emulation)
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile.webshell
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}-webshell:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
