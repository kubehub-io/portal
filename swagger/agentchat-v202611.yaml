openapi: 3.0.3
info:
  title: Kubehub Agent Chat API
  version: 2026.10.0
  description: |
    API for creating and continuing support-agent chat conversations.
    All chat endpoints require a bearer token. The caller's user and tenant
    ownership are derived from the token and are not accepted in request bodies.
servers:
  - url: /
tags:
  - name: Health
  - name: Chat
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
              example: OK
  /apis/agentchat-v202611/threads:
    get:
      tags: [Chat]
      summary: List the caller's chat threads
      operationId: listThreads
      responses:
        '200':
          description: Chat threads, newest activity first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StoreError'
    post:
      tags: [Chat]
      summary: Create a chat thread
      operationId: createThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
            examples:
              cluster:
                value:
                  title: Production support
                  cluster_name: cluster-abc
      responses:
        '200':
          description: Created chat thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal cluster resolution or persistence error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apis/agentchat-v202611/threads/{threadID}:
    parameters:
      - $ref: '#/components/parameters/ThreadID'
    get:
      tags: [Chat]
      summary: Get a chat thread
      operationId: getThread
      responses:
        '200':
          description: Chat thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /apis/agentchat-v202611/threads/{threadID}/messages:
    parameters:
      - $ref: '#/components/parameters/ThreadID'
    get:
      tags: [Chat]
      summary: List messages in a chat thread
      operationId: listMessages
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreError'
    post:
      tags: [Chat]
      summary: Send a message and stream the agent response
      description: |
        Appends the user message and starts an agent run. The response is a
        server-sent event stream.

        The stream carries four event types:

        - `token` — a chunk of generated assistant text. Concatenate `content`.
        - `progress` — advisory activity while the agent works, so the client
          can show which tool is running and which ReAct step it is on. It is
          not required to render the answer, and a client that ignores it still
          receives the complete response.
        - `error` — a human-readable failure. The stream stays open for `done`.
        - `done` — exactly one terminal event. On success it carries the
          persisted `message_id` and the run's token `usage`; on failure it
          carries the error.

        `progress` frames are deliberately reduced before they reach the
        browser. They contain `type` (`iteration_started`, `tool_started`,
        `tool_completed`, `tool_failed` or `command_started`), `tool`,
        `iteration`, `call_id` and `elapsed_ms`, plus `max_iterations` on
        `iteration_started` frames. Tool arguments and shell command previews
        stay inside the cluster, so a `command_started` frame names the tool
        but carries no command text.

        `usage` on the `done` event is the run's consumption summed over every
        model call it made in the agent's ReAct loop. It is omitted when the
        run made no model call. The same numbers are persisted on the run
        record, which is the system of record for billing and reporting.

        Before the run starts, the Chat API reconciles the agent sandbox
        resources and mints a token for `agentServiceAccount` using the
        caller's bearer token. The agent service is called with that service
        account token, not with the caller's token.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: Why is my application pod restarting?
              agentServiceAccount: agent-sandbox/default-chat-agent-sa
      responses:
        '200':
          description: Server-sent agent response stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completed:
                  summary: Successful run with progress and token usage
                  value: |
                    event: progress
                    data: {"type":"iteration_started","iteration":1,"max_iterations":20}

                    event: progress
                    data: {"type":"tool_started","tool":"pods_list","iteration":1,"call_id":"call-1"}

                    event: progress
                    data: {"type":"tool_completed","tool":"pods_list","iteration":1,"call_id":"call-1","elapsed_ms":412}

                    event: token
                    data: {"content":"The pod is restarting because "}

                    event: token
                    data: {"content":"..."}

                    event: progress
                    data: {"type":"iteration_started","iteration":2,"max_iterations":20}

                    event: done
                    data: {"status":"completed","run_id":"run-id","thread_id":"thread-id","message_id":"message-id","usage":{"prompt_tokens":1200,"completion_tokens":40,"total_tokens":1240,"cached_tokens":900,"reasoning_tokens":12,"model_calls":2}}
                failed:
                  summary: Failed run that still spent tokens
                  value: |
                    event: error
                    data: {"message":"the agent run failed"}

                    event: done
                    data: {"status":"failed","run_id":"run-id","thread_id":"thread-id","error":"the agent run failed","usage":{"prompt_tokens":800,"completion_tokens":30,"total_tokens":830,"model_calls":1}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another agent run is already in progress for this thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RUN_IN_PROGRESS
                  message: an agent run is already in progress for this thread
        '500':
          $ref: '#/components/responses/StoreError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ThreadID:
      name: threadID
      in: path
      required: true
      description: Chat thread identifier
      schema:
        type: string
        minLength: 1
  schemas:
    CreateThreadRequest:
      type: object
      description: The cluster name identifies the caller's existing cluster.
      properties:
        title:
          type: string
        cluster_name:
          type: string
      required: [cluster_name]
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        agentServiceAccount:
          type: string
          description: |
            Service account the agent runs as, in `namespace/name` form. The
            Chat API reconciles the sandbox runtime and RBAC for it, then
            exchanges the caller's token for a token of this service account.
            Defaults to `agent-sandbox/default-chat-agent-sa` when omitted.
          example: agent-sandbox/default-chat-agent-sa
    Thread:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        cluster_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, thread_id, role, content, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
    AgentProgress:
      type: object
      description: |
        Payload of a `progress` server-sent event. It reports activity that
        produces no assistant text: a new ReAct step starting, a tool starting
        or finishing, or a sandbox command starting. It is advisory and carries
        no model-generated payload beyond the tool name.
      required: [type]
      properties:
        type:
          type: string
          enum:
            - iteration_started
            - tool_started
            - tool_completed
            - tool_failed
            - command_started
        tool:
          type: string
          description: Name of the tool being called, on tool events.
        iteration:
          type: integer
          format: int64
          description: 1-based turn of the agent's ReAct loop.
        max_iterations:
          type: integer
          format: int64
          description: |
            Configured bound for this run, set on `iteration_started` frames,
            for rendering "step 3 of 20".
        call_id:
          type: string
          description: Identifies one tool invocation, so parallel calls are distinct.
        elapsed_ms:
          type: integer
          format: int64
          description: How long a completed or failed step took.
    TokenUsage:
      type: object
      description: |
        Token consumption of one agent run, summed over every model call in its
        ReAct loop. Reported on the `done` event and persisted on the run
        record. Counts are zero when the provider did not report usage.
      required: [prompt_tokens, completion_tokens, total_tokens, model_calls]
      properties:
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        cached_tokens:
          type: integer
          format: int64
          description: Part of `prompt_tokens` served from a provider cache.
        reasoning_tokens:
          type: integer
          format: int64
          description: Part of `completion_tokens` spent on reasoning.
        model_calls:
          type: integer
          format: int64
          description: How many model invocations the run made.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller cannot provision the sandbox resources or mint the agent service account token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Thread not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StoreError:
      description: Database or persistence error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
